name: Update models nightly

on:
  schedule:
    - cron: "0 0 * * *"  # midnight UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update_models:
    name: Scrape models and open PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape Apple Support pages
        run: python update_models.py -f txt -f json

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: update-models
        run: |
          if git diff --quiet -- models.txt models.json; then
            echo "No changes to models.txt or models.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add models.txt models.json
          git commit -m "Update models"
          # Bot owns this branch; force is fine so an open PR picks up new scrapes.
          git push --force origin "HEAD:$BRANCH"

          if gh pr list --head "$BRANCH" --state open --json number --jq 'length' | grep -qx 0; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "Update models" \
              --body "Automated refresh of \`models.txt\` and \`models.json\` from Apple Support identify pages."
          else
            echo "Pull request for $BRANCH already exists; branch updated in place"
          fi
